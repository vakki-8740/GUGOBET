<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Chat Manage — GBET-PENNAL</title>
<link rel="icon" type="image/jpeg" href="favicon/b74ab3b922824a6ccc26837cb6f4498b.jpg">
<link rel="stylesheet" href="assets/css/admin.css?v=20261020n">
</head>
<body data-page="chat">

<header class="topbar">
  <div class="brand">
    <span class="brand-logo"><img src="logo/logo.cb987a2.png" alt="GBET logo"></span>
    <div class="brand-text">
      <strong>GBET-PENNAL</strong>
      <span>Support admin</span>
    </div>
  </div>
  <span class="flight">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 15.5v-2l-7.5-4.6V3.6a1.6 1.6 0 0 0-3.2 0v5.3L3.3 13.5v2l7.5-2.3v4.6l-2.3 1.6v1.4l3.9-1.1 3.9 1.1v-1.4l-2.3-1.6v-4.6z"/></svg>
    <span id="liveChip">Offline</span>
  </span>
  <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu"></button>
</header>

<main class="wrap">

  <div class="list-head">
    <h2>Chat Manage</h2>
    <span class="muted" id="chatMeta"></span>
  </div>

  <div class="chat-list" id="chatList"></div>

  <button type="button" class="btn-outline btn-clear" id="clearChat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    Clear all chats
  </button>

</main>

<div class="modal" id="clearModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
    <div class="modal-head">
      <h3 id="clearTitle">Clear all chats?</h3>
      <button type="button" class="modal-x" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="modal-text">All chat messages saved on this device will be deleted.</p>
    <div class="modal-actions">
      <button type="button" class="btn-outline" data-close>Cancel</button>
      <button type="button" class="btn-danger" id="clearConfirm">Clear</button>
    </div>
  </div>
</div>

<div class="modal" id="replyModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="replyTitle">
    <div class="modal-head">
      <h3 id="replyTitle">Reply to user</h3>
      <button type="button" class="modal-x" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <p class="modal-text" id="replyWho"></p>
    <textarea class="reply-textarea" id="replyText" rows="4" maxlength="1000" placeholder="Type your reply…"></textarea>
    <div class="modal-actions">
      <button type="button" class="btn-outline" data-close>Cancel</button>
      <button type="button" class="btn-primary" id="replySend">Send reply</button>
    </div>
  </div>
</div>

<script src="assets/js/data.js?v=20261020n"></script>
<script src="assets/js/menu.js?v=20261020n"></script>
<script src="assets/js/chat.js?v=20261020n"></script>
<script type="module">
  if (!window.GBET_FB) import('./assets/js/firebase.js?v=20261020n');
</script>
</body>
</html>
