<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Setting — GBET-PENNAL</title>
<link rel="icon" type="image/jpeg" href="favicon/b74ab3b922824a6ccc26837cb6f4498b.jpg">
<link rel="stylesheet" href="assets/css/admin.css?v=20261020l">
</head>
<body data-page="settings">

<header class="topbar">
  <div class="brand">
    <span class="brand-logo"><img src="logo/logo.cb987a2.png" alt="GBET logo"></span>
    <div class="brand-text">
      <strong>GBET-PENNAL</strong>
      <span>Support admin</span>
    </div>
  </div>
  <span class="flight">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.5 15.5v-2l-7.5-4.6V3.6a1.6 1.6 0 0 0-3.2 0v5.3L3.3 13.5v2l7.5-2.3v4.6l-2.3 1.6v1.4l3.9-1.1 3.9 1.1v-1.4l-2.3-1.6v-4.6z"/></svg>
    <span>Offline</span>
  </span>
  <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu"></button>
</header>

<main class="wrap">

  <div class="page-head"><h2>Setting</h2></div>

  <section class="panel">
    <div class="panel-head"><h2>App</h2></div>
    <div class="rows">
      <div class="row"><span>Data source</span><b>Firestore (live)</b></div>
      <div class="row"><span>Connection</span><b id="setConn">Connecting…</b></div>
      <div class="row"><span>App version</span><b>1.0</b></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Storage</h2></div>
    <div class="rows">
      <div class="row"><span>Complaints</span><b id="setComplaints">0</b></div>
      <div class="row"><span>Chat messages</span><b id="setChats">0</b></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>About</h2></div>
    <p class="about-text">GBET-PENNAL is the live support admin panel for GUGOBET. Complaints and chats are stored in Firebase Firestore.</p>
  </section>

</main>

<script src="assets/js/data.js?v=20261020l"></script>
<script src="assets/js/menu.js?v=20261020l"></script>
<script src="assets/js/settings.js?v=20261020l"></script>
</body>
</html>
