<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>E-mail Verification Complaint Page — GUGOBET Support</title>
<link rel="icon" type="image/png" href="logo/logo.cb987a2.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261020o">
<link rel="stylesheet" href="assets/css/login-gate.css?v=20261020o">
</head>
<body data-page="email">

<header class="app-header">
  <div class="header-left"></div>
  <div class="header-center">
    <div class="header-title">E-mail Verification</div>
  </div>
  <div class="header-right">
    <a class="icon-btn" id="inboxBtn" href="inbox.html" aria-label="Inbox"></a>
  </div>
</header>

<main class="page">

  <div class="page-back">
    <button type="button" class="back-link" id="backBtn" aria-label="Go back"></button>
  </div>

  <div id="storageNotice"></div>

  <form id="emailForm" class="form-card" novalidate>

    <h1 class="form-title">E-mail Verification Complaint Page</h1>

    <div class="field">
      <label for="emlName">User name <span class="req">*</span></label>
      <input class="input" id="emlName" name="name" type="text" placeholder="Enter your name" autocomplete="off" maxlength="60">
      <span class="field-error"></span>
    </div>

    <div class="field">
      <label for="emlUid">Enter UID <span class="req">*</span></label>
      <input class="input" id="emlUid" name="uid" type="text" placeholder="Enter your UID" autocomplete="off" maxlength="40">
      <span class="field-error"></span>
    </div>

    <div class="field">
      <label for="emlMobile">Mobile number <span class="req">*</span></label>
      <input class="input" id="emlMobile" name="mobile" type="tel" inputmode="tel" placeholder="Enter mobile number" autocomplete="off" maxlength="15">
      <span class="field-error"></span>
    </div>

    <div class="field">
      <label for="emlEmail">Enter email (for Verification) <span class="req">*</span></label>
      <input class="input" id="emlEmail" name="email" type="email" placeholder="Enter email for verification" autocomplete="off" maxlength="120">
      <span class="field-error"></span>
    </div>

    <div class="field">
      <div class="upload-box" data-upload>
        <input class="upload-input" type="file" id="emlProof" accept="image/*">
        <label class="upload-body" for="emlProof">
          <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
          <span class="upload-text">
            <span class="upload-title" data-file-label>Upload issue image ( max 10 mb )</span>
          </span>
          <img class="upload-thumb" data-file-thumb alt="Issue image preview">
        </label>
        <span class="upload-badge" data-upload-badge hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Image uploaded</span>
      </div>
      <span class="field-error"></span>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary btn-block" type="submit">Submit Now</button>
    </div>

  </form>

  <div id="successView" class="success-view" hidden></div>

</main>

<script src="assets/js/store.js?v=20261020o"></script>
<script src="assets/js/app.js?v=20261020o"></script>
<script src="assets/js/complaint-form.js?v=20261020o"></script>
<script src="assets/js/login-gate.js?v=20261020o"></script>
<script>
  GS_FORM({
    formId: 'emailForm',
    successId: 'successView',
    category: 'email',
    fields: [
      { name: 'name', label: 'User name', required: true, requiredMsg: 'User name is required.', maxLen: 60 },
      { name: 'uid', label: 'Enter UID', required: true, requiredMsg: 'UID is required.', maxLen: 40 },
      { name: 'mobile', label: 'Mobile number', required: true, requiredMsg: 'Mobile number is required.', maxLen: 15 },
      { name: 'email', label: 'Enter email (for Verification)', required: true, type: 'email', requiredMsg: 'Email is required.', errorMsg: 'Enter a valid email address.' }
    ]
  });
</script>
<script type="module" src="assets/js/firebase-sync.js?v=20261020o"></script>
</body>
</html>
