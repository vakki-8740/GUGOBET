<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Online Chat — GUGOBET Support</title>
<link rel="icon" type="image/png" href="logo/logo.cb987a2.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261020j">
</head>
<body data-page="chat">

<header class="app-header">
  <div class="header-left">
    <button type="button" class="icon-btn" id="menuBtn"></button>
  </div>
  <div class="header-center">
    <div class="header-title">Online Chat</div>
  </div>
  <div class="header-right">
    <a class="icon-btn" id="inboxBtn" href="inbox.html" aria-label="Inbox"></a>
  </div>
</header>

<main class="chat-page">

  <div class="notice chat-notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    <span><strong>Live chat is not connected yet.</strong> Chat setup is still pending — messages you send are saved on this device only.</span>
  </div>

  <div class="chat-bar">
    <span class="hint">Chat history stays on this device.</span>
    <button type="button" class="btn btn-sm btn-ghost" id="clearChatBtn">Clear history</button>
  </div>

  <div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>

  <form class="composer" id="chatForm" autocomplete="off">
    <input class="input" id="chatInput" type="text" placeholder="Type a message" maxlength="500" aria-label="Message">
    <button class="btn btn-primary send-btn" type="submit" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>

</main>

<script src="assets/js/store.js?v=20261020j"></script>
<script src="assets/js/app.js?v=20261020j"></script>
<script src="assets/js/chat.js?v=20261020j"></script>
</body>
</html>
