<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Inbox — GUGOBET Support</title>
<link rel="icon" type="image/png" href="logo/logo.cb987a2.png">
<link rel="stylesheet" href="assets/css/style.css?v=20261020o">
</head>
<body data-page="inbox">

<header class="app-header">
  <div class="header-left">
    <button type="button" class="icon-btn" id="menuBtn"></button>
  </div>
  <div class="header-center">
    <div class="header-title">Inbox</div>
  </div>
  <div class="header-right">
    <a class="icon-btn" id="inboxBtn" href="inbox.html" aria-label="Inbox"></a>
  </div>
</header>

<main class="page">

  <div id="storageNotice"></div>

  <div class="inbox-tools">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="input" id="searchInput" type="search" placeholder="Search complaints" autocomplete="off">
    </div>
    <div class="filter-row">
      <select class="select" id="catFilter" aria-label="Filter by category">
        <option value="">All categories</option>
        <option value="deposit">Deposit problem</option>
        <option value="withdrawal">Withdrawal problem</option>
        <option value="email">E-mail verification</option>
      </select>
      <select class="select" id="statusFilter" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Success">Success</option>
      </select>
    </div>
  </div>

  <div id="countLine" class="count-line" hidden></div>

  <div id="inboxBody"></div>

</main>

<script src="assets/js/store.js?v=20261020o"></script>
<script src="assets/js/app.js?v=20261020o"></script>
<script src="assets/js/inbox.js?v=20261020o"></script>
</body>
</html>
